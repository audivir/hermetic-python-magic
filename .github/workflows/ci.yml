name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # add mypy to path
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: j178/prek-action@v3.0.0
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Remove system libmagic, if any
        run: |
          lib_path="$(ldconfig -p | awk '$1 ~ /^libmagic\.so/ {print $NF; exit}')"
          if [ -z "$lib_path" ]; then
            echo "no system libmagic found, nothing to remove"
            exit 0
          fi

          real_lib_path="$(readlink -f "$lib_path")"

          for f in "$lib_path" "$real_lib_path" "$(dirname "$lib_path")/magic.mgc" /usr/share/file/magic.mgc /usr/share/misc/magic.mgc /usr/lib/file/magic.mgc; do
            if [ -f "$f" ]; then
              echo "removing $f"
              sudo rm -f "$f"
            fi
          done
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run coverage run -m pytest
      - run: uv run coverage combine || true
      - run: uv run coverage report
