name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match pyproject.toml version ($pkg_version)"
            exit 1
          fi
  build-wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14] # , windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool patchelf
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - name: Setup MSYS2 and MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-autotools mingw-w64-x86_64-libsystre
          path-type: inherit
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: uv build --wheel
      - name: Build wheel (Linux/macOS)
        if: runner.os != 'Windows'
        run: uv build --wheel
      - name: Repair Linux wheels for PyPI (manylinux)
        if: runner.os == 'Linux'
        run: |
          for whl in dist/*.whl; do
            uvx auditwheel repair "$whl" -w dist_repaired/
          done
          rm -rf dist/
          mv dist_repaired/ dist/
      - name: Repair macOS wheels (delocate)
        if: runner.os == 'macOS'
        run: |
          for whl in dist/*.whl; do
            uvx --from delocate delocate-wheel -w dist_repaired/ -v "$whl"
          done
          rm -rf dist/
          mv dist_repaired/ dist/
      - name: Repair Windows wheels (delvewheel)
        if: runner.os == 'Windows'
        run: |
          # delvewheel bundles the MSYS2/MinGW DLLs (like gnurx) directly into the wheel
          for whl in dist/*.whl; do
            uvx delvewheel repair -w dist_repaired/ -v "$whl"
          done
          rm -rf dist/
          mv dist_repaired/ dist/
      - uses: actions/upload-artifact@v7
        with:
          # use both OS and Python version in the artifact name to avoid overwriting
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
  build-sdist:
    name: Build Source Distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
